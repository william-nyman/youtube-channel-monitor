[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-channel-monitor"
version = "1.0.0"
description = "Python program that monitors YouTube channels for new uploads."
requires-python = ">=3.11"

dependencies = ["requests", "feedparser", "python-dotenv", "fastapi[standard]"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.6",
]

[project.scripts]
ytmonitor = "youtube_channel_monitor.cli:commands"


[tool.setuptools.packages.find]
where = ["src"]
